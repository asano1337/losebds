<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GymFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='1' stop-color='%23FF6B35'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230A0B0F'/%3E%3Cpath d='M20 5 10 17h6l-2 10 10-13h-6z' fill='url(%23g)'/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0F; --bg-elevated:#12141A; --surface:rgba(255,255,255,.035); --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --text:#F5F5F7; --text-secondary:#8B8D98; --text-tertiary:#5A5C66;
  --accent:#00E5FF; --accent-glow:rgba(0,229,255,.4); --accent-secondary:#FF6B35;
  --success:#4ADE80; --danger:#F87171; --gold:#FFD166;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; background:var(--bg); overscroll-behavior:none;}
body{font-family:'Manrope',sans-serif; color:var(--text); font-weight:500; -webkit-font-smoothing:antialiased;}
#app{position:relative; max-width:460px; margin:0 auto; height:100vh; overflow:hidden; display:flex; flex-direction:column;}
.orb{position:fixed; width:400px; height:400px; border-radius:50%; filter:blur(90px); opacity:.08; pointer-events:none; z-index:0; animation:float 20s ease-in-out infinite;}
.orb-cyan{background:var(--accent); top:-120px; right:-120px;}
.orb-orange{background:var(--accent-secondary); bottom:-120px; left:-140px; animation-delay:-10s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(-20px,25px);}}
.screen{position:relative; z-index:1; flex:1; overflow-y:auto; scrollbar-width:none; padding:20px 16px 110px;}
.screen::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
button:active, .tappable:active{transform:scale(.97); transition:transform .15s;}
input,textarea{font-family:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; font-size:16px; width:100%; outline:none;}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:none; font-size:14px;}
.icon{width:20px; height:20px; stroke:currentColor; stroke-width:1.8; fill:none; flex-shrink:0;}
.ellipsis{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.clamp2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

.card{background:var(--surface); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:12px; opacity:0; animation:fadeInUp .5s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes fadeInUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 var(--accent-glow);}50%{box-shadow:0 0 22px var(--accent-glow);}}
.pulse{animation:pulse 1s ease 2;}
.h1{font-size:26px; font-weight:800; letter-spacing:-0.6px;}
.h2{font-size:16px; font-weight:700; letter-spacing:-0.3px; margin-bottom:14px;}
.label{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--text-secondary); text-transform:uppercase;}
.stat-num{font-size:24px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums;}
.sub{color:var(--text-secondary); font-size:14px; margin-top:4px;}

.header{display:flex; align-items:center; gap:12px; margin-bottom:20px; opacity:0; animation:fadeInUp .5s cubic-bezier(.4,0,.2,1) forwards;}
.logo-mark{width:38px; height:38px; border-radius:11px; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.avatar{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-secondary)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#0A0B0F; flex-shrink:0; margin-left:auto;}

.hero{position:relative; overflow:hidden; background:linear-gradient(135deg, rgba(0,229,255,.08), rgba(255,107,53,.04));}
.hero::before{content:''; position:absolute; top:-60px; right:-60px; width:160px; height:160px; border-radius:50%; background:var(--accent); filter:blur(50px); opacity:.25;}
.hero-title{font-size:24px; font-weight:800; margin:6px 0 16px; position:relative;}
.btn-primary{background:var(--accent); color:#0A0B0F; font-weight:700; font-size:14px; padding:14px 22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 0 24px var(--accent-glow); position:relative;}
.btn-primary:disabled{opacity:.4; box-shadow:none;}
.btn-secondary{background:var(--surface); border:1px solid var(--border-strong); color:var(--text); font-weight:700; font-size:14px; padding:14px 22px; border-radius:999px; display:inline-flex; align-items:center; gap:8px; justify-content:center;}
.btn-secondary:disabled{opacity:.35;}
.btn-ghost{background:none; color:var(--accent); font-weight:700; font-size:13px;}
.btn-row{display:flex; gap:10px;}
.btn-row>*{flex:1;}

.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stat-card{position:relative;}
.stat-icon{position:absolute; top:16px; right:16px; opacity:.35; width:18px; height:18px;}

.ring-row{display:flex; align-items:center; gap:16px;}

.ex-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-icon{width:40px; height:40px; border-radius:12px; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent);}
.ex-icon svg{width:20px; height:20px;}
.ex-name{font-weight:600; font-size:14px;}
.ex-muscle{font-size:12px; color:var(--text-tertiary);}
.dots{display:flex; gap:4px; margin-left:auto;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--border-strong);}
.dot.done{background:var(--accent);}

.dock{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(18,20,26,.85); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:999px; padding:6px; z-index:20; padding-bottom:calc(6px + env(safe-area-inset-bottom));}
.dock-btn{display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 14px; border-radius:999px; color:var(--text-secondary); font-size:12px; font-weight:700;}
.dock-btn.active{background:var(--accent); color:#0A0B0F; box-shadow:0 0 20px var(--accent-glow);}
.dock svg{width:17px; height:17px; stroke:currentColor; stroke-width:1.8; fill:none;}

.ob-wrap{padding:24px 20px; height:100%; display:flex; flex-direction:column; position:relative; z-index:1;}
.ob-opt{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:10px;}
.ob-opt.sel{border-color:var(--accent); background:rgba(0,229,255,.08);}
.ob-opt-title{font-weight:700; font-size:15px;}
.ob-opt-sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
.ob-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong); flex-shrink:0;}
.ob-opt.sel .ob-check{border-color:var(--accent); background:var(--accent); position:relative;}
.ob-opt.sel .ob-check::after{content:''; position:absolute; left:6px; top:2px; width:5px; height:9px; border:solid #0A0B0F; border-width:0 2px 2px 0; transform:rotate(45deg);}
.ob-dots{display:flex; gap:6px; justify-content:center; margin:20px 0;}
.ob-dot{width:8px; height:8px; border-radius:999px; background:var(--border-strong); transition:all .3s;}
.ob-dot.active{width:24px; background:var(--accent);}

.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; opacity:0; pointer-events:none; transition:opacity .3s;}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; max-width:460px; margin:0 auto; max-height:88vh; overflow-y:auto; scrollbar-width:none; background:var(--bg-elevated); border-radius:24px 24px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); z-index:51; transform:translateY(100%); transition:transform .4s cubic-bezier(.32,.72,0,1); border-top:1px solid var(--border-strong);}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:999px; margin:0 auto 18px;}
.field-row{display:flex; gap:10px; margin:16px 0;}
.field{flex:1;}
.field label{font-size:12px; color:var(--text-secondary); margin-bottom:6px; display:block;}
.sheet-actions{display:flex; gap:10px; margin-top:8px;}
.sheet-actions button{flex:1; text-align:center; justify-content:center;}
.checkmark-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 0;}
.checkmark-wrap svg{width:60px; height:60px;}
.checkmark-wrap circle{fill:none; stroke:var(--success); stroke-width:3; stroke-dasharray:157; stroke-dashoffset:157; animation:circ .5s ease forwards;}
.checkmark-wrap path{fill:none; stroke:var(--success); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; animation:check .3s ease .4s forwards;}
@keyframes circ{to{stroke-dashoffset:0;}}
@keyframes check{to{stroke-dashoffset:0;}}

.pr-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
.pr-row:last-child{border-bottom:none;}
.pr-medal{font-size:20px; width:28px; text-align:center;}

.workout-screen{position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1);}
.workout-screen.show{transform:translateX(0);}
.workout-top{padding:calc(16px + env(safe-area-inset-top)) 16px 10px;}
.workout-top-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.wprogress-track{width:100%; height:3px; border-radius:3px; background:var(--border); overflow:hidden;}
.wprogress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-secondary)); border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1);}
.wbadge{display:inline-block; font-size:11px; color:var(--accent); background:rgba(0,229,255,.1); padding:4px 10px; border-radius:999px; margin-top:8px;}
.workout-body{flex:1; overflow-y:auto; padding:16px; scrollbar-width:none;}
.workout-bottom{padding:14px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); display:flex; gap:10px;}
.set-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.set-num{width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--text-secondary); font-size:13px; flex-shrink:0;}
.set-row input{padding:12px;}
.set-remove{color:var(--text-tertiary); font-size:20px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.hint-card{background:rgba(255,209,102,.1); border:1px solid rgba(255,209,102,.3); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--gold); margin-bottom:16px;}

.rest-bar{position:fixed; top:0; left:0; right:0; max-width:460px; margin:0 auto; z-index:45; background:var(--bg-elevated); border-bottom:1px solid var(--border-strong); padding:calc(14px + env(safe-area-inset-top)) 18px 14px; transform:translateY(-100%); transition:transform .35s cubic-bezier(.32,.72,0,1);}
.rest-bar.show{transform:translateY(0);}
.rest-num{font-size:34px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:-1px;}
.rest-track{width:100%; height:5px; border-radius:5px; background:var(--border); overflow:hidden; margin:10px 0 12px;}
.rest-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-secondary)); border-radius:5px; transition:width 1s linear;}
.rest-dur{display:flex; gap:6px; justify-content:center; margin-bottom:10px;}
.rest-dur-btn{padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.rest-dur-btn.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}

.heatmap-scroll{overflow-x:auto; scrollbar-width:none; margin:6px 0;}
.heatmap-grid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); gap:3px; width:max-content;}
.hm-cell{width:11px; height:11px; border-radius:3px; background:var(--border);}
.legend{display:flex; align-items:center; gap:5px; margin-top:10px; font-size:11px; color:var(--text-tertiary);}
.legend .hm-cell{width:9px; height:9px;}
#hmTooltip{font-size:13px; color:var(--text); margin-top:8px; min-height:18px;}

.spark{display:block; margin-top:4px;}
.picker-item{display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; margin-bottom:6px; background:var(--surface);}
.freq-row{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 16px;}
.freq-btn{width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1;}
.freq-btn.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}
.day-block{border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px;}

.prog-cover{height:110px; border-radius:16px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.prog-cover svg{width:56px; height:56px; opacity:.85;}

.pd-screen{position:fixed; inset:0; z-index:35; background:var(--bg); overflow-y:auto; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); scrollbar-width:none;}
.pd-screen.show{transform:translateX(0);}
.pd-top{padding:calc(16px + env(safe-area-inset-top)) 16px 0;}
.pd-back{display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary); font-weight:700; font-size:13px; margin-bottom:12px;}
.pd-cover{height:160px; border-radius:20px; margin-bottom:16px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.pd-cover svg{width:80px; height:80px;}
.pd-body{padding:0 16px calc(24px + env(safe-area-inset-bottom));}
.pd-day{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); gap:10px;}
.pd-day:last-child{border-bottom:none;}
.pd-day-exs{padding:6px 0 10px; display:none;}
.pd-day-exs.open{display:block;}
.pd-day-ex-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; color:var(--text-secondary); gap:10px;}

.shimmer{background:linear-gradient(90deg, var(--surface-hover) 25%, rgba(255,255,255,.1) 37%, var(--surface-hover) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; height:14px; margin-bottom:8px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.ai-tip{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.ai-tip:last-child{border-bottom:none;}

.ach-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.ach-badge{aspect-ratio:1; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--surface-hover); border:1px solid var(--border); opacity:.35; filter:grayscale(1);}
.ach-badge.unlocked{background:linear-gradient(135deg, rgba(0,229,255,.25), rgba(255,107,53,.15)); border-color:var(--accent); opacity:1; filter:none;}

.premium-screen{position:fixed; inset:0; z-index:36; background:var(--bg); overflow-y:auto; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); scrollbar-width:none;}
.premium-screen.show{transform:translateX(0);}
.pf-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
.pf-row:last-child{border-bottom:none;}
.price-card{background:linear-gradient(135deg, rgba(0,229,255,.12), rgba(255,107,53,.08)); border:1px solid var(--border-strong); border-radius:18px; padding:20px; text-align:center; margin:16px 0;}

[data-theme="light"]{--bg:#F6F7FA; --bg-elevated:#FFFFFF; --surface:rgba(0,0,0,.03); --surface-hover:rgba(0,0,0,.06); --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --text:#0A0B0F; --text-secondary:#5A5C66; --text-tertiary:#8B8D98; --accent:#0097B2; --accent-glow:rgba(0,151,178,.3); --accent-secondary:#FF6B35;}
[data-theme="light"] .dock{background:rgba(255,255,255,.88);}
.pbadge{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.8px; color:var(--accent); background:rgba(0,229,255,.12); padding:3px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; text-transform:uppercase;}
.lockbox{position:relative;}
.lockbox.locked .lk-content{filter:blur(6px); pointer-events:none; user-select:none;}
.lk-over{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.seg{display:flex; gap:8px; margin-bottom:4px;}
.seg-b{flex:1; padding:12px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-weight:700; font-size:14px;}
.seg-b.sel{background:var(--accent); color:#0A0B0F; border-color:var(--accent);}
.m-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;}
.m-row:last-child{border-bottom:none;}
</style>
</head>
<body>

/* ---------- STATE ---------- */
let state = loadState();
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem('gymflow_state')); if(s){ migrate(s); return s; } }catch(e){}
  return { user:{goal:null,level:null,program:null,name:firstName(),customPrograms:[],restTime:90,isPremium:false,profile:emptyProfile()}, theme:"dark", workouts:[], currentDayIndex:0, points:0, onboardingDone:false, achievements:[] };
}
function migrate(s){
  if(!s.user.customPrograms) s.user.customPrograms = [];
  if(!s.user.restTime) s.user.restTime = 90;
  if(s.user.isPremium===undefined) s.user.isPremium = false;
  if(!s.achievements) s.achievements = [];
  s.user.profile = Object.assign(emptyProfile(), s.user.profile||{}); if(!Array.isArray(s.user.profile.weightHistory)) s.user.profile.weightHistory=[]; if(!s.theme) s.theme='dark';
  s.workouts = (s.workouts||[]).map(w=>{
    if(w.exercises) return w;
    const byEx = {};
    (w.sets||[]).forEach(set=>{ (byEx[set.exercise] = byEx[set.exercise]||[]).push({weight:set.weight, reps:set.reps}); });
    return { name:w.name, date:w.date, duration:w.duration, exercises:Object.entries(byEx).map(([name,sets])=>({name,sets})) };
  });
}
function saveState(){ localStorage.setItem('gymflow_state', JSON.stringify(state)); }
function allPrograms(){ const custom={}; state.user.customPrograms.forEach(p=>{ custom[p.id]=p; }); return Object.assign({}, PROGRAMS, custom); }
function hintStore(){ try{ return JSON.parse(localStorage.getItem('gymflow_hints')||'{}'); }catch(e){ return {}; } }
function markHintShown(key){ const h=hintStore(); h[key]=true; localStorage.setItem('gymflow_hints', JSON.stringify(h)); }

/* ---------- ONBOARDING ---------- */
let obStep = 0; let obChoice = {goal:null, level:null, program:null}; let pfDraft = emptyProfile();
function renderOnboarding(){
  const wrap = document.getElementById('onboarding');
  if(obStep===3){ renderProfileStep(wrap); return; }
  const steps = [
    {title:'Какая у тебя цель?', sub:'Подберём программу под тебя', opts:GOALS, key:'goal'},
    {title:'Твой уровень?', sub:'Чтобы точно рассчитать нагрузку', opts:LEVELS, key:'level'},
    {title:'Выбери программу', sub:'Всегда можно сменить позже', opts:PROG_OPTS, key:'program'}
  ];
  const s = steps[obStep];
  wrap.innerHTML = `
    ${obStep===0?`<div class="logo-mark" style="margin-bottom:16px;">${icon('logo','')}</div>`:''}
    <div class="h1">${s.title}</div>
    <div class="sub" style="margin-bottom:24px;">${s.sub}</div>
    <div>${s.opts.map(o=>`
      <div class="ob-opt tappable" data-id="${o.id}">
        <div><div class="ob-opt-title">${o.t}</div><div class="ob-opt-sub">${o.s}</div></div>
        <div class="ob-check"></div>
      </div>`).join('')}
    </div>
    <div style="flex:1;"></div>
    <div class="ob-dots">${[0,1,2,3].map(i=>`<div class="ob-dot ${i===obStep?'active':''}"></div>`).join('')}</div>
    <button class="btn-primary" id="obNext" style="width:100%; opacity:.4; pointer-events:none;">Далее</button>
  `;
  wrap.querySelectorAll('.ob-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      haptic('light');
      wrap.querySelectorAll('.ob-opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      obChoice[s.key] = el.dataset.id;
      const btn = document.getElementById('obNext');
      btn.style.opacity = 1; btn.style.pointerEvents = 'auto';
    });
  });
  document.getElementById('obNext').addEventListener('click', ()=>{
    haptic('medium');
    if(obStep < 3){ obStep++; renderOnboarding(); }
    else{
      state.user.goal=obChoice.goal; state.user.level=obChoice.level; state.user.program=obChoice.program;
      state.user.name=firstName(); state.user.customPrograms=state.user.customPrograms||[]; state.onboardingDone=true;
      saveState(); boot();
    }
  });
}

/* ---------- HELPERS ---------- */
function currentProgram(){ return allPrograms()[state.user.program] || PROGRAMS.fullbody; }
function todayDay(){ const prog=currentProgram(); return prog.days[state.currentDayIndex % prog.days.length]; }
function weekCompleted(){ const wk=7*24*3600*1000, now=Date.now(); return state.workouts.filter(w=>now-new Date(w.date).getTime()<wk).length; }
function streak(){
  if(!state.workouts.length) return 0;
  let s=0; const day=24*3600*1000; let cursor=new Date().setHours(0,0,0,0);
  const dates=new Set(state.workouts.map(w=>new Date(w.date).setHours(0,0,0,0)));
  while(dates.has(cursor)){ s++; cursor-=day; }
  return s;
}
function totalVolume(){ let v=0; state.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>v+=s.weight*s.reps))); return Math.round(v); }
function monthVolume(from=0){ const now=Date.now(), mo=30*86400000; let v=0;
  state.workouts.forEach(w=>{ const t=new Date(w.date).getTime(); if(now-t<mo+from*mo && now-t>=from*mo) w.exercises.forEach(e=>e.sets.forEach(s=>v+=s.weight*s.reps)); });
  return Math.round(v);
}
function totalSets(){ let c=0; state.workouts.forEach(w=>w.exercises.forEach(e=>c+=e.sets.length)); return c; }
function maxWeightFor(name){ let m=0; state.workouts.forEach(w=>w.exercises.forEach(e=>{ if(e.name===name) e.sets.forEach(s=>{ if(s.weight>m) m=s.weight; }); })); return m; }
function personalRecords(){
  const best={}; state.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>{ if(!best[e.name]||s.weight>best[e.name]) best[e.name]=s.weight; })));
  return Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
function exerciseProgress(){
  const agg={};
  state.workouts.forEach(w=>w.exercises.forEach(e=>{
    if(!agg[e.name]) agg[e.name]={max:0,sets:0,sessions:[]};
    const maxInSession=Math.max(...e.sets.map(s=>s.weight));
    agg[e.name].sets+=e.sets.length; if(maxInSession>agg[e.name].max) agg[e.name].max=maxInSession;
    agg[e.name].sessions.push({date:w.date, max:maxInSession});
  }));
  return Object.entries(agg);
}
function sparkline(sessions){
  const last=sessions.slice(-5); if(last.length<2) return '';
  const max=Math.max(...last.map(s=>s.max)), min=Math.min(...last.map(s=>s.max));
  const pts=last.map((s,i)=>{ const x=i/(last.length-1)*60; const y=max===min?10:20-((s.max-min)/(max-min))*18; return `${x},${y}`; }).join(' ');
  return `<svg class="spark" width="60" height="20" viewBox="0 0 60 20"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function lastWorkoutWith(name){
  const list = state.workouts.filter(w=>w.exercises.some(e=>e.name===name)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!list.length) return null;
  const w = list[0]; const ex = w.exercises.find(e=>e.name===name);
  const maxSet = ex.sets.reduce((a,s)=> s.weight>=(a?a.weight:0) ? s : a, null);
  return { date:w.date, set:maxSet };
}

/* ---------- LOCAL AI INSIGHTS ---------- */
function generateLocalInsights(){
  const tips = [];
  if(state.workouts.length===0) return ['Начни первую тренировку, чтобы увидеть персональные инсайты 💪'];
  const st = streak();
  if(st>=2) tips.push(`🔥 Твоя лучшая серия — ${st} ${st===1?'день':'дня/дней'}. Не разрывай её сегодня!`);
  const prog = exerciseProgress().filter(([,d])=>d.sessions.length>=2).sort((a,b)=>b[1].sessions.length-a[1].sessions.length)[0];
  if(prog){ const s=prog[1].sessions; const first=s[0].max, last=s[s.length-1].max;
    if(last>first) tips.push(`📊 Средний вес в «${prog[0]}» вырос с ${first} до ${last} кг за последние тренировки.`); }
  const muscleCount={};
  state.workouts.forEach(w=>w.exercises.forEach(e=>{ const m=(EXERCISES[e.name]||{}).muscle; if(m) muscleCount[m]=(muscleCount[m]||0)+1; }));
  const sortedM = Object.entries(muscleCount).sort((a,b)=>b[1]-a[1]);
  if(sortedM.length>=2){ const all=['Грудь','Спина','Ноги','Плечи','Руки','Пресс']; const lagging = all.find(m=>!muscleCount[m]) || sortedM[sortedM.length-1][0];
    tips.push(`💪 Ты чаще всего тренируешь ${sortedM[0][0].toLowerCase()}. Добавь упражнений на ${lagging.toLowerCase()}.`); }
  const thisMo = monthVolume(0), prevMo = monthVolume(1);
  if(prevMo>0){ const diff=Math.round((thisMo-prevMo)/prevMo*100); tips.push(`⚡ Объём за месяц: ${thisMo} кг — это ${diff>=0?'больше':'меньше'} прошлого на ${Math.abs(diff)}%.`); }
  return tips.slice(0,3);
}

/* ---------- WORKOUT FLOW ---------- */
let session = null;
function startWorkoutFlow(repeat){
  haptic('medium');
  if(repeat){
    const last = [...state.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    session = { day:{label:last.name}, exIndex:0, repeatFrom:last.date,
      exercises: last.exercises.map(e=>({name:e.name, sets:e.sets.map(s=>({weight:s.weight, reps:s.reps}))})) };
  } else {
    const day = todayDay();
    session = { day, exIndex:0, repeatFrom:null, exercises: day.ex.map(name=>({name, sets:[]})) };
  }
  document.getElementById('workoutScreen').classList.add('show');
  renderWorkoutStep();
}
function renderWorkoutStep(){
  const scr = document.getElementById('workoutScreen');
  if(session.exIndex >= session.exercises.length){ finishWorkout(); return; }
  const cur = session.exercises[session.exIndex];
  const e = EXERCISES[cur.name] || {icon:'ex-bench-press', muscle:''};
  const pct = Math.round(session.exIndex/session.exercises.length*100);
  const hintData = getOverloadHint(cur.name);
  scr.innerHTML = `
    <div class="workout-top">
      <div class="workout-top-row">
        <button id="wCancel" style="color:var(--text-secondary); font-weight:700; font-size:13px;">Отмена</button>
        <div style="flex:1; text-align:center;"><div class="label">${session.exIndex+1} из ${session.exercises.length}</div></div>
        <div style="width:50px;"></div>
      </div>
      <div class="wprogress-track"><div class="wprogress-fill" style="width:${pct}%"></div></div>
      ${session.repeatFrom?`<div class="wbadge">${icon('repeat','icon')} На основе тренировки от ${new Date(session.repeatFrom).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div>`:''}
    </div>
    <div class="workout-body">
      <div class="ex-icon" style="width:56px; height:56px; border-radius:16px; margin-bottom:12px;">${exIcon(e.icon,'icon')}</div>
      <div class="h1" style="margin-bottom:2px;">${cur.name}</div>
      <div class="sub" style="margin-bottom:16px;">${e.muscle}</div>
      ${hintData ? `<div class="hint-card">💡 ${hintData}</div>` : ''}
      <div id="setsList"></div>
      <button class="btn-secondary" id="addSet" style="width:100%; margin-top:6px;">+ Добавить подход</button>
    </div>
    <div class="workout-bottom">
      <button class="btn-primary" id="doneEx" style="width:100%;">Упражнение выполнено</button>
    </div>
  `;
  function renderSets(){
    const list = document.getElementById('setsList');
    list.innerHTML = cur.sets.map((s,i)=>`
      <div class="set-row">
        <div class="set-num">${i+1}</div>
        <input type="number" inputmode="decimal" placeholder="кг" value="${s.weight||''}" data-i="${i}" data-f="weight">
        <input type="number" inputmode="numeric" placeholder="повт." value="${s.reps||''}" data-i="${i}" data-f="reps">
        <div class="set-remove tappable" data-rm="${i}">×</div>
      </div>`).join('') || `<div class="sub" style="margin-bottom:10px;">Пока нет подходов — добавь первый</div>`;
    list.querySelectorAll('input').forEach(inp=>{ inp.addEventListener('input', ()=>{ cur.sets[inp.dataset.i][inp.dataset.f] = parseFloat(inp.value)||0; }); });
    list.querySelectorAll('[data-rm]').forEach(b=>{ b.addEventListener('click', ()=>{ haptic('light'); cur.sets.splice(parseInt(b.dataset.rm),1); renderSets(); }); });
  }
  renderSets();
  document.getElementById('addSet').addEventListener('click', ()=>{
    haptic('light'); const last=cur.sets[cur.sets.length-1];
    cur.sets.push({ weight:last?last.weight:0, reps:last?last.reps:0 }); renderSets();
  });
  document.getElementById('doneEx').addEventListener('click', ()=>{
    cur.sets = cur.sets.filter(s=>s.weight>0 && s.reps>0);
    haptic('medium');
    maybeSuggestProgress(cur);
    const isLast = session.exIndex >= session.exercises.length-1;
    session.exIndex++;
    if(isLast){ renderWorkoutStep(); } else { showRestTimer(()=>renderWorkoutStep()); }
  });
  document.getElementById('wCancel').addEventListener('click', ()=>{ haptic('light'); document.getElementById('workoutScreen').classList.remove('show'); session=null; });
}
function getOverloadHint(name){
  const info = lastWorkoutWith(name);
  if(!info || !info.set) return null;
  const key = 'ov_'+name+'_'+info.date;
  if(hintStore()[key]) return null;
  markHintShown(key);
  if(info.set.reps>=12) return `В прошлый раз: ${info.set.weight} кг × ${info.set.reps}. Попробуй ${info.set.weight+2.5} кг сегодня!`;
  if(info.set.reps<8) return `В прошлый раз было тяжело (${info.set.reps} повт. на ${info.set.weight} кг). Попробуй тот же вес или чуть легче.`;
  return null;
}
function maybeSuggestProgress(ex){
  if(ex.sets.length<3) return;
  const w = ex.sets[0].weight;
  const allSame = ex.sets.every(s=>s.weight===w && s.reps>=12);
  if(!allSame) return;
  const key = 'progress_'+ex.name+'_'+new Date().toDateString();
  if(hintStore()[key]) return;
  markHintShown(key);
  popup('Ты готов к прогрессу! 📈', `Поднять вес в «${ex.name}» на 2.5 кг в следующий раз?`);
}

/* ---------- REST TIMER ---------- */
let restInterval = null;
function showRestTimer(onDone){
  const bar = document.getElementById('restBar');
  let remaining = state.user.restTime;
  const total = remaining;
  function render(){
    bar.innerHTML = `
      <div class="rest-num">${remaining}с</div>
      <div class="rest-track"><div class="rest-fill" style="width:${remaining/total*100}%"></div></div>
      <div class="rest-dur">${[60,90,120].map(d=>`<div class="rest-dur-btn tappable ${state.user.restTime===d?'sel':''}" data-d="${d}">${d}с</div>`).join('')}</div>
      <div class="btn-row"><button class="btn-secondary" id="restSkip">Пропустить</button><button class="btn-secondary" id="restPlus">+30 сек</button></div>
    `;
    bar.querySelectorAll('[data-d]').forEach(b=>{ b.addEventListener('click', ()=>{ haptic('light'); state.user.restTime=parseInt(b.dataset.d); saveState(); remaining=state.user.restTime; render(); }); });
    document.getElementById('restSkip').addEventListener('click', finish);
    document.getElementById('restPlus').addEventListener('click', ()=>{ haptic('light'); remaining+=30; render(); });
  }
  function finish(){ clearInterval(restInterval); bar.classList.remove('show'); onDone(); }
  render();
  bar.classList.add('show');
  restInterval = setInterval(()=>{
    remaining--;
    if(remaining<=0){ notify('success'); finish(); return; }
    const track = bar.querySelector('.rest-fill'); const num = bar.querySelector('.rest-num');
    if(track) track.style.width = (remaining/total*100)+'%'; if(num) num.textContent = remaining+'с';
  }, 1000);
}

function finishWorkout(){
  const totalSetsCount = session.exercises.reduce((a,e)=>a+e.sets.length,0);
  state.workouts.push({ name:session.day.label, date:new Date().toISOString(), duration:totalSetsCount*3, exercises:session.exercises.filter(e=>e.sets.length) });
  state.currentDayIndex++; state.points += totalSetsCount*10;
  saveState();
  document.getElementById('workoutScreen').classList.remove('show');
  session = null;
  notify('success'); haptic('medium'); setTimeout(()=>haptic('medium'),150);
  popup('Готово! 🎉', 'Тренировка завершена!');
  checkAchievements();
  renderHome();
}

/* ---------- HEATMAP ---------- */
function dailyAgg(){
  const map={};
  state.workouts.forEach(w=>{
    const key=new Date(w.date).toDateString();
    if(!map[key]) map[key]={exCount:0, volume:0};
    map[key].exCount += w.exercises.length;
    w.exercises.forEach(e=>e.sets.forEach(s=>map[key].volume += s.weight*s.reps));
  });
  return map;
}
function heatColor(c){ if(!c) return 'var(--border)'; if(c<=2) return 'rgba(0,229,255,0.2)'; if(c<=4) return 'rgba(0,229,255,0.5)'; return 'var(--accent)'; }
function renderHeatmap(){
  const agg=dailyAgg(); const days=168; const today=new Date(); today.setHours(0,0,0,0); const cells=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(today.getTime()-i*86400000); const key=d.toDateString(); const data=agg[key]||{exCount:0,volume:0};
    cells.push(`<div class="hm-cell tappable" style="background:${heatColor(data.exCount)}" data-date="${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}" data-count="${data.exCount}" data-vol="${Math.round(data.volume)}"></div>`);
  }
  return `<div class="heatmap-scroll"><div class="heatmap-grid">${cells.join('')}</div></div>
    <div id="hmTooltip" class="sub">Нажми на день, чтобы увидеть детали</div>
    <div class="legend">меньше<div class="hm-cell" style="background:var(--border)"></div><div class="hm-cell" style="background:rgba(0,229,255,0.2)"></div><div class="hm-cell" style="background:rgba(0,229,255,0.5)"></div><div class="hm-cell" style="background:var(--accent)"></div>больше</div>`;
}

        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null,
          amount: 1,
          title: 'GymFlow Premium',
          description: 'Подписка на 1 месяц',
        }),
      });
      const data = await res.json();
      if (!data.invoiceLink) throw new Error(data.error || 'Не удалось создать счёт');

      tg.openInvoice(data.invoiceLink, (status) => {
        if (status === 'paid') {
          state.user.isPremium = true;
          saveState();
          haptic('medium');
          notify('success');
          popup('Премиум активирован! 🎉', 'Спасибо за поддержку! Все функции разблокированы.'); onPremiumActivated();
          document.getElementById('premiumScreen').classList.remove('show');

        }
      });
    } catch (err) {
      console.error(err);
      alertMsg('Ошибка: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Оформить за 1 ⭐';

/* ---------- CALCULATIONS ---------- */
const ACT_K = {sedentary:1.2, light:1.375, medium:1.55, high:1.725, extreme:1.9};
const ACTS = [{id:'sedentary',t:'Сидячий',s:'Мало движения, офисная работа'},{id:'light',t:'Лёгкий',s:'1-2 тренировки в неделю'},{id:'medium',t:'Средний',s:'3-4 тренировки в неделю'},{id:'high',t:'Высокий',s:'5-6 тренировок в неделю'},{id:'extreme',t:'Очень высокий',s:'Физ. работа + тренировки'}];
const RW_TABLE = [['Приседания',[.5,1,1.5]],['Жим штанги лёжа',[.4,.8,1.2]],['Становая',[.6,1.2,1.8]],['Жим стоя',[.3,.5,.8]],['Румынская тяга',[.5,1,1.5]],['Тяга штанги в наклоне',[.4,.7,1]],['Подтягивания',[0,.15,.35]]];
function calcBMI(w,h){ return Math.round(w/Math.pow(h/100,2)*10)/10; }
function bmiCat(b){ return b<18.5?{t:'Недовес',c:'#60A5FA'} : b<25?{t:'Норма',c:'var(--accent)'} : b<30?{t:'Избыток',c:'var(--gold)'} : {t:'Ожирение',c:'var(--danger)'}; }
function calcBMR(g,w,h,a){ return Math.round(10*w+6.25*h-5*a+(g==='male'?5:-161)); }
function calcTDEE(bmr,act){ return Math.round(bmr*(ACT_K[act]||1.2)); }
function calcTargetCalories(tdee,goal){ return Math.round(tdee*(goal==='lose'?.85:goal==='gain'?1.15:1)); }
function calcMacros(cal,w){ const p=1.8*w, f=.9*w; return {protein:Math.round(p), fat:Math.round(f), carbs:Math.max(0,Math.round((cal-p*4-f*9)/4))}; }
function calcWater(w){ return Math.round(w*35/100)/10; }
function calcGoalForecast(cur,target,targetCal,tdee){
  const need=target-cur, delta=targetCal-tdee;
  if(need===0) return {days:0, date:new Date()};
  if(!delta || Math.sign(need)!==Math.sign(delta)) return null;
  const days=Math.ceil(Math.abs(need)*7700/Math.abs(delta));
  return {days, date:new Date(Date.now()+days*86400000)};
}
function recommendedWeights(w,level){
  const i = level==='advanced'?2 : level==='medium'?1 : 0;
  return RW_TABLE.map(([name,k])=>({name, weight:Math.floor(w*k[i]/2.5)*2.5, unit:name==='Подтягивания'?'доп. кг':'кг'}));
}
function emptyProfile(){ return {gender:null, age:null, height:null, weight:null, targetWeight:null, activity:null, weightHistory:[]}; }
function inR(v,a,b){ return typeof v==='number' && isFinite(v) && v>=a && v<=b; }
function pfValid(d){ return (d.gender==='male'||d.gender==='female') && inR(d.age,14,90) && inR(d.height,120,220) && inR(d.weight,30,200) && inR(d.targetWeight,30,200) && !!ACT_K[d.activity]; }
function metrics(){
  const p=state.user.profile; if(!pfValid(p)) return null;
  const bmr=calcBMR(p.gender,p.weight,p.height,p.age), tdee=calcTDEE(bmr,p.activity), tc=calcTargetCalories(tdee,state.user.goal);
  return {bmi:calcBMI(p.weight,p.height), bmr, tdee, tc, macros:calcMacros(tc,p.weight), water:calcWater(p.weight)};
}

function saveWeight(w){
  const p=state.user.profile, t=todayStr(), l=p.weightHistory[p.weightHistory.length-1];
  p.weight=w; if(l && l.date===t) l.weight=w; else p.weightHistory.push({date:t, weight:w});
  saveState();
}
function openSheet(html){ $('sheet').innerHTML=html; $('overlay').classList.add('show'); $('sheet').classList.add('show'); }
function openProfileEdit(){
  const d=Object.assign({}, state.user.profile);
  openSheet(`<div class="sheet-handle"></div><div class="h1" style="margin-bottom:14px;">Редактировать профиль</div>${pfFormHTML(d)}<div class="sheet-actions" style="margin-top:16px;"><button class="btn-secondary" id="peC">Отмена</button><button class="btn-primary" id="peS">Сохранить</button></div>`);
  const s=$('peS'); const upd=()=>{ const ok=pfValid(d); s.style.opacity=ok?1:.4; s.style.pointerEvents=ok?'auto':'none'; };
  pfBind($('sheet'),d,upd); upd();
  $('peC').addEventListener('click', ()=>{ haptic('light'); closeSheet(); });
  s.addEventListener('click', ()=>{ if(!pfValid(d)) return; haptic('medium'); saveProfile(d); closeSheet(); renderProfile(); });
}
function openWeightUpdate(){
  const p=state.user.profile;
  openSheet(`<div class="sheet-handle"></div><div class="h1" style="margin-bottom:14px;">Обновить вес</div><div class="field" style="margin-bottom:16px;"><label>Новый вес, кг</label><input id="nwW" type="number" inputmode="decimal" value="${p.weight||''}"></div><div class="sheet-actions"><button class="btn-secondary" id="nwC">Отмена</button><button class="btn-primary" id="nwS">Сохранить</button></div>`);
  $('nwC').addEventListener('click', ()=>{ haptic('light'); closeSheet(); });
  $('nwS').addEventListener('click', ()=>{
    const w=parseFloat($('nwW').value);
    if(!inR(w,30,200)){ haptic('light'); alertMsg('Вес должен быть от 30 до 200 кг'); return; }
    haptic('medium'); saveWeight(w); closeSheet(); renderProfile();
  });
}

/* ---------- PROFILE SCREEN ---------- */
function years(a){ const d=a%10, h=a%100; return a+' '+(d===1&&h!==11?'год':(d>=2&&d<=4&&(h<12||h>14))?'года':'лет'); }
function weightSpark(h){
  h=h.slice(-30); if(h.length<2) return '<div class="sub">Добавь ещё одно взвешивание — построим график.</div>';
  const ws=h.map(x=>x.weight), mx=Math.max(...ws), mn=Math.min(...ws);
  const pts=ws.map((w,i)=>(i/(ws.length-1)*280).toFixed(1)+','+(mx===mn?25:(46-((w-mn)/(mx-mn))*42).toFixed(1))).join(' ');
  return `<svg viewBox="0 0 280 50" width="100%" height="50" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function themeCard(){
  const t=document.documentElement.getAttribute('data-theme')||'dark';
  return `<div class="card"><div class="h2">Оформление <span class="pbadge">⭐ Premium</span></div>
    <div class="seg"><button class="seg-b ${t==='dark'?'sel':''}" data-th="dark">Тёмная</button><button class="seg-b ${t==='light'?'sel':''}" data-th="light">${isPremium()?'':'🔒 '}Светлая</button></div></div>`;
}
function openProfile(){ renderProfile(); $('profileScreen').classList.add('show'); }
function renderProfile(){
  const scr=$('profileScreen'), p=state.user.profile, m=metrics(); let body;
  if(!m){
    body=`<div class="card"><div class="h2">Заполни профиль</div><div class="sub" style="margin:0 0 14px;">Пол, рост, вес и активность нужны для расчёта калорий, БЖУ и рабочих весов.</div><button class="btn-primary" data-pedit>Заполнить</button></div>`;
  } else {
    const hist=p.weightHistory, start=hist.length?hist[0].weight:p.weight, tw=p.targetWeight;
    const pr=start===tw?1:Math.max(0,Math.min(1,(start-p.weight)/(start-tw)));
    const bc=bmiCat(m.bmi), R=30, C=2*Math.PI*R, off=C*(1-Math.min(m.bmi/40,1));
    const mc=m.macros, tot=m.tc||1;
    const bar=(n,g,cal,col)=>`<div style="margin-bottom:12px;"><div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>${n}</span><b>${g} г</b></div><div class="rest-track" style="margin:0; height:6px;"><div style="height:100%; width:${Math.min(100,Math.round(cal/tot*100))}%; background:${col}; border-radius:5px;"></div></div></div>`;
    const fc=calcGoalForecast(p.weight,tw,m.tc,m.tdee);
    const fcHTML = !fc ? `<div class="sub">Для прогноза цель (${GOALS.find(g=>g.id===state.user.goal)?GOALS.find(g=>g.id===state.user.goal).t:'—'}) должна совпадать с направлением целевого веса.</div>`
      : fc.days===0 ? `<div class="h2" style="margin:0;">Цель достигнута 🎉</div>`
      : `<div style="font-size:15px; line-height:1.5;">При текущем темпе достигнешь <b>${tw} кг</b> к <b>${fc.date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</b></div><div class="sub" style="margin:4px 0 10px;">Это через ${fc.days} дн.</div>`;
    body=`
    <div class="card">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;"><div class="avatar" style="margin:0;">${state.user.name[0].toUpperCase()}</div><div><div class="h2" style="margin:0;">${state.user.name}</div><div class="sub" style="margin:0;">${p.gender==='male'?'Мужской':'Женский'}, ${years(p.age)}</div></div></div>
      <div style="display:flex; justify-content:space-between; align-items:flex-end;"><div><div class="label">Сейчас</div><div class="stat-num" style="font-size:34px;">${p.weight}<span class="sub"> кг</span></div></div><div style="text-align:right;"><div class="label">Цель</div><div class="stat-num" style="font-size:34px; color:var(--accent);">${tw}<span class="sub"> кг</span></div></div></div>
      <div class="rest-track" style="margin:14px 0 0;"><div class="rest-fill" style="width:${Math.round(pr*100)}%"></div></div>
    </div>
    <div class="card"><div class="h2">Мои показатели</div>
      <div class="ring-row" style="margin-bottom:10px;"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="${R}" stroke="var(--border)" stroke-width="6" fill="none"/><circle cx="40" cy="40" r="${R}" stroke="${bc.c}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="800">${m.bmi}</text></svg>
      <div><div class="label">ИМТ</div><div style="font-weight:800; font-size:18px; color:${bc.c};">${bc.t}</div></div></div>
      <div class="m-row"><span>BMR (базовый обмен)</span><b>${m.bmr} ккал/день</b></div>
      <div class="m-row"><span>TDEE (с активностью)</span><b>${m.tdee} ккал/день</b></div>
      <div class="m-row"><span>Рекомендуемые калории</span><b style="color:var(--accent);">${m.tc} ккал/день</b></div>
    </div>
    <div class="card"><div class="h2">Питание <span class="pbadge">⭐ Premium</span></div>${lockWrap(bar('Белки',mc.protein,mc.protein*4,'var(--accent)')+bar('Жиры',mc.fat,mc.fat*9,'var(--accent-secondary)')+bar('Углеводы',mc.carbs,mc.carbs*4,'var(--gold)')+`<div class="m-row"><span>Норма воды</span><b>${m.water} л/день</b></div>`)}</div>
    <div class="card"><div class="h2">Рабочие веса <span class="pbadge">⭐ Premium</span></div>${lockWrap(recommendedWeights(p.weight,state.user.level).map(r=>`<div class="m-row"><span>${r.name}</span><b>${r.weight} ${r.unit}</b></div>`).join(''))}</div>
    <div class="card"><div class="h2">Прогноз цели <span class="pbadge">⭐ Premium</span></div>${lockWrap(fcHTML+weightSpark(hist))}</div>
    <div class="btn-row" style="margin-bottom:12px;"><button class="btn-primary" data-pweight>Обновить вес</button><button class="btn-secondary" data-pedit>Редактировать</button></div>`;
  }
  scr.innerHTML = `<div class="pd-top"><div class="pd-back tappable" id="prBack">← Назад</div><div class="h1" style="margin-bottom:16px;">Профиль</div></div><div class="pd-body">${body}${themeCard()}</div>`;
  const on=(sel,fn)=>scr.querySelectorAll(sel).forEach(b=>b.addEventListener('click',fn));
  on('#prBack', ()=>{ haptic('light'); scr.classList.remove('show'); });
  on('[data-pedit]', ()=>{ haptic('light'); openProfileEdit(); });
  on('[data-pweight]', ()=>{ haptic('light'); openWeightUpdate(); });
  on('[data-unlock]', ()=>{ haptic('medium'); openPremium(); });
  scr.querySelectorAll('[data-th]').forEach(b=>b.addEventListener('click', ()=>{
    haptic('light'); const t=b.dataset.th;
    if(t==='light' && !requirePremium('Светлая тема')) return;
    applyTheme(t); renderProfile();
  }));
}

/* ---------- NAV ---------- */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.querySelectorAll('.dock-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.remove('hidden');
  document.querySelector(`.dock-btn[data-tab="${tab}"]`).classList.add('active');
  if(tab==='home'){ renderHome(); if(tg && tg.BackButton) tg.BackButton.hide(); }
  if(tab==='stats'){ renderStats(); if(tg && tg.BackButton) tg.BackButton.show(); }
  if(tab==='programs'){ renderPrograms(); if(tg && tg.BackButton) tg.BackButton.show(); }
}
document.querySelectorAll('.dock-btn').forEach(b=>{ b.addEventListener('click', ()=>{ haptic('light'); switchTab(b.dataset.tab); }); });
if(tg && tg.BackButton){ tg.BackButton.onClick(()=>{ haptic('light'); switchTab('home'); }); }

/* ---------- BOOT ---------- */
function boot(){
  initTheme();
  if(!state.onboardingDone){
    document.getElementById('onboarding').classList.remove('hidden');
    document.getElementById('main').classList.add('hidden');
    obStep=0; obChoice={goal:null,level:null,program:null}; pfDraft=emptyProfile();
    renderOnboarding();
  } else {
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    switchTab('home');
  }
}
boot();
</script>
</body>
</html>
